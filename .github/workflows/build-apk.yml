name: Construir APK de Cosmódromo

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Localizar el proyecto web
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          INDEX=$(find . -maxdepth 3 -name index.html -not -path '*/node_modules/*' -not -path './mobile-build/*' | head -n 1)
          if [ -z "$INDEX" ]; then
            echo "::error::No se encontró index.html en el repositorio"
            ls -R . | head -50
            exit 1
          fi
          SRC=$(dirname "$INDEX")
          echo "Proyecto web en: $SRC"
          echo "src=$SRC" >> "$GITHUB_OUTPUT"
          for d in css js wasm lib; do
            [ -d "$SRC/$d" ] || { echo "::error::Falta la carpeta $SRC/$d"; exit 1; }
          done

      - name: Preparar proyecto Capacitor
        shell: bash
        env:
          SRC: ${{ steps.locate.outputs.src }}
        run: |
          set -euo pipefail
          WORK="$PWD/mobile-build"
          mkdir -p "$WORK/www"
          cp "$SRC/index.html" "$WORK/www/"
          cp -R "$SRC/css" "$SRC/js" "$SRC/wasm" "$SRC/lib" "$WORK/www/"
          cd "$WORK"
          cat > package.json <<'JSON'
          {
            "name": "cosmodromo-mobile",
            "version": "1.0.0",
            "private": true
          }
          JSON
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.cosmodromo.game",
            "appName": "Cosmodromo",
            "webDir": "www",
            "server": { "androidScheme": "https" }
          }
          JSON
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/android@6 @capacitor/cli@6
          npx cap add android
          npx cap sync android

      - name: Compilar APK debug
        shell: bash
        run: |
          set -euo pipefail
          cd mobile-build/android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Publicar APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: Cosmodromo-Android-APK
          path: mobile-build/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
